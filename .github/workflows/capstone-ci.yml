name: Voting App Capstone CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Application and Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e
          test -f vote/Dockerfile
          test -f result/Dockerfile
          test -f worker/Dockerfile
          test -f docker-compose.yml
          test -f voting-app/Chart.yaml

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ./voting-app

      - name: Validate Helm templates
        run: helm template voting-helm ./voting-app

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        service:
          - vote
          - result
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: voting-app-${{ matrix.service }}:test
